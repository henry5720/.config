<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 讓 WSL 直接使用 Windows 內建字型(含中文) -->
  <dir>/mnt/c/Windows/Fonts</dir>

  <!-- 中文預設字型:微軟正黑體 -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Microsoft JhengHei</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>MingLiU</family></prefer>
  </alias>
</fontconfig>
